name: Release

on:
  push:
    tags:
      # 1、2、3 …：每个 tag 都会构建 APK 并打包模块
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.C17_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.C17_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.C17_KEY_PASSWORD }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # versionCode 取的是 commit 数，必须拉完整历史
          fetch-depth: 0
          # 需要校验上一个 tag 是否存在
          fetch-tags: true

      - name: 校验 tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            if [[ ! "$TAG" =~ ^([0-9]+)$ ]]; then
              echo "::error::tag 必须是纯数字（1、2、3 …），当前为 $TAG"
              exit 1
            fi
            NUM="${BASH_REMATCH[1]}"
            if [ "$NUM" -lt 1 ]; then
              echo "::error::tag 版本号必须 >= 1"
              exit 1
            fi
            if [ "$NUM" -gt 1 ] && ! git rev-parse -q --verify "refs/tags/$((NUM - 1))" >/dev/null; then
              echo "::error::缺少上一个版本 tag：$((NUM - 1))，请按顺序发版"
              exit 1
            fi
          fi

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 SDK 组件
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::未找到 sdkmanager（$SDK_ROOT）"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('code/**/*.gradle*', 'code/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 还原签名密钥
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/c17-release.jks
        run: |
          echo "${{ secrets.C17_KEYSTORE_B64 }}" | base64 -d > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"

      - name: 构建 APK
        working-directory: code
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/c17-release.jks
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: 统计适配应用数量
        id: adapted
        run: |
          COUNT=$(python3 - <<'PY'
          import os

          root = "my_product/media/theme/uxicons/hdpi"
          skip = (".", "temp_", "plus.", "icons-")
          names = []
          for name in os.listdir(root):
              if not os.path.isdir(os.path.join(root, name)):
                  continue
              if name.startswith(skip) or name.endswith(".bak") or "." not in name:
                  continue
              # com.yipiao#com.app.main.entrance.MainActivity 这类写法只取包名
              names.append(name.split("#")[0])

          name_set = set(names)
          apps = set()
          for name in names:
              if "和" in name:
                  apps.update(name.split("和"))
                  continue
              # “包名.Activity” 目录归并到包名
              parts = name.split(".")
              if any(".".join(parts[:i]) in name_set for i in range(1, len(parts))):
                  continue
              apps.add(name)
          print(len(apps))
          PY
          )
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: 准备 APK
        id: apk
        run: |
          APK="code/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          cp "$APK" "ColorOS17PerfectIcon.apk"
          test -s "ColorOS17PerfectIcon.apk"
          echo "name=ColorOS17PerfectIcon.apk" >> "$GITHUB_OUTPUT"

      - name: 打包 Magisk 模块
        id: module
        run: |
          CODE=$(git rev-list --count HEAD)
          OUT="ColorOS17PerfectIcon_${CODE}_apps${{ steps.adapted.outputs.count }}.zip"
          python3 script/打包成magisk模块.py -q -o "$OUT"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"

      - name: 生成 update.json
        run: |
          CODE=$(git rev-list --count HEAD)
          python3 - "$GITHUB_REF_NAME" "$CODE" "${{ steps.module.outputs.name }}" <<'PY'
          import json
          import sys
          import urllib.parse

          tag, code, zip_name = sys.argv[1], sys.argv[2], sys.argv[3]
          base = "https://github.com/imRoxy2222/ColorOS17PerfectIcon"
          data = {
              "version": code,
              "versionCode": int(code),
              "zipUrl": f"{base}/releases/download/{tag}/{urllib.parse.quote(zip_name)}",
              "changelog": f"{base}/releases/tag/{tag}",
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ColorOS17PerfectIcon-${{ github.ref_name }}
          path: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.module.outputs.name }}
            update.json

      - name: 生成 Release 说明
        id: notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # 纯数字 tag 即版本号，上一个版本直接减 1
          NUM="$TAG"
          if [[ "$NUM" =~ ^[0-9]+$ ]] && [ "$NUM" -gt 1 ]; then
            PREV="$((NUM - 1))"
          else
            PREV=""
          fi
          python3 - "$TAG" "$PREV" "$REPO" > release_notes.md <<'PY'
          import subprocess
          import sys

          tag, prev, repo = sys.argv[1], sys.argv[2], sys.argv[3]
          limit = 50

          rev_range = f"{prev}..HEAD" if prev else "HEAD"
          raw = subprocess.run(
              ["git", "log", rev_range, "--no-merges", "--pretty=format:%h\t%s"],
              capture_output=True, text=True, check=True,
          ).stdout.strip()

          commits = []
          for line in raw.splitlines():
              sha, _, subject = line.partition("\t")
              commits.append(f"- {subject} (`{sha}`)")

          lines = [f"## 更新内容（共 {len(commits)} 条提交）"]
          if commits:
              lines += commits[:limit]
          else:
              lines.append("- 本次发布没有新的提交")

          rest = commits[limit:]
          if rest:
              lines += [
                  "",
                  "<details>",
                  f"<summary>完整变更日志（其余 {len(rest)} 条）</summary>",
                  "",
                  *rest,
                  "",
                  "</details>",
              ]

          if prev:
              lines += [
                  "",
                  f"**Full Changelog**: https://github.com/{repo}/compare/{prev}...{tag}",
              ]
          print("\n".join(lines))
          PY
          echo "path=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.module.outputs.name }}
            update.json

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_FILE: ${{ runner.temp }}/c17-release.jks
      KEYSTORE_PASSWORD: ${{ secrets.C17_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.C17_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.C17_KEY_PASSWORD }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # versionCode 取的是 commit 数，必须拉完整历史
          fetch-depth: 0

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('code/**/*.gradle*', 'code/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 还原签名密钥
        run: |
          echo "${{ secrets.C17_KEYSTORE_B64 }}" | base64 -d > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"

      - name: 构建 APK
        working-directory: code
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: 校验并重命名 APK
        id: apk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CODE=$(git rev-list --count HEAD)
          APK="code/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          OUT="ColorOS17PerfectIcon-${VERSION}-${CODE}.apk"
          cp "$APK" "$OUT"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"

      - name: 打包 Magisk 模块
        id: module
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="ColorOSart-${VERSION}.zip"
          python3 build.py -q -o "$OUT"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ColorOS17PerfectIcon-${{ github.ref_name }}
          path: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.module.outputs.name }}

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.module.outputs.name }}

name: Release

on:
  push:
    tags:
      # 1、2、3 …：只打模块包，复用最近一次 Release 里的 APK
      # 7-apk：同时构建 APK 和模块包
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.C17_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.C17_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.C17_KEY_PASSWORD }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # versionCode 取的是 commit 数，必须拉完整历史
          fetch-depth: 0
          # 需要校验上一个 tag 是否存在
          fetch-tags: true

      - name: 判断构建类型
        id: meta
        run: |
          BUILD_APK=true
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            if [[ "$TAG" =~ ^([0-9]+)$ ]]; then
              NUM="${BASH_REMATCH[1]}"
              BUILD_APK=false
            elif [[ "$TAG" =~ ^([0-9]+)-apk$ ]]; then
              NUM="${BASH_REMATCH[1]}"
              BUILD_APK=true
            else
              echo "::error::tag 必须是纯数字（1、2、3 …）或 <数字>-apk（如 7-apk），当前为 $TAG"
              exit 1
            fi
            if [ "$NUM" -lt 1 ]; then
              echo "::error::tag 版本号必须 >= 1"
              exit 1
            fi
            if [ "$NUM" -gt 1 ] && ! git rev-parse -q --verify "refs/tags/$((NUM - 1))" >/dev/null; then
              echo "::error::缺少上一个版本 tag：$((NUM - 1))，请按顺序发版"
              exit 1
            fi
            if [ "$BUILD_APK" = true ] && ! git rev-parse -q --verify "refs/tags/$NUM" >/dev/null; then
              echo "::error::缺少对应的数字 tag：$NUM，请先发 $NUM 再发 $TAG"
              exit 1
            fi
          fi
          echo "build_apk=$BUILD_APK" >> "$GITHUB_OUTPUT"

      - name: 配置 JDK 17
        if: steps.meta.outputs.build_apk == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 SDK 组件
        if: steps.meta.outputs.build_apk == 'true'
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::未找到 sdkmanager（$SDK_ROOT）"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: 缓存 Gradle
        if: steps.meta.outputs.build_apk == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('code/**/*.gradle*', 'code/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 还原签名密钥
        if: steps.meta.outputs.build_apk == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/c17-release.jks
        run: |
          echo "${{ secrets.C17_KEYSTORE_B64 }}" | base64 -d > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"

      - name: 构建 APK
        if: steps.meta.outputs.build_apk == 'true'
        working-directory: code
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/c17-release.jks
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: 统计适配应用数量
        id: adapted
        run: |
          COUNT=$(python3 - <<'PY'
          import os

          root = "my_product/media/theme/uxicons/hdpi"
          skip = (".", "temp_", "plus.", "icons-")
          names = []
          for name in os.listdir(root):
              if not os.path.isdir(os.path.join(root, name)):
                  continue
              if name.startswith(skip) or name.endswith(".bak") or "." not in name:
                  continue
              # com.yipiao#com.app.main.entrance.MainActivity 这类写法只取包名
              names.append(name.split("#")[0])

          name_set = set(names)
          apps = set()
          for name in names:
              if "和" in name:
                  apps.update(name.split("和"))
                  continue
              # “包名.Activity” 目录归并到包名
              parts = name.split(".")
              if any(".".join(parts[:i]) in name_set for i in range(1, len(parts))):
                  continue
              apps.add(name)
          print(len(apps))
          PY
          )
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: 准备 APK
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.meta.outputs.build_apk }}" = "true" ]; then
            APK="code/app/build/outputs/apk/release/app-release.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
            cp "$APK" "完美图标.apk"
          else
            echo "复用最近一次 Release 的 APK"
            if ! gh release download --pattern "完美图标.apk" --dir .; then
              echo "::error::最近一次 Release 没有 完美图标.apk，请先发一个 <数字>-apk tag"
              exit 1
            fi
          fi
          test -s "完美图标.apk"
          echo "name=完美图标.apk" >> "$GITHUB_OUTPUT"

      - name: 打包 Magisk 模块
        id: module
        run: |
          CODE=$(git rev-list --count HEAD)
          OUT="完美图标模块_${CODE}_适配${{ steps.adapted.outputs.count }}.zip"
          python3 script/打包成magisk模块.py -q -o "$OUT"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"

      - name: 生成 update.json
        run: |
          CODE=$(git rev-list --count HEAD)
          python3 - "$GITHUB_REF_NAME" "$CODE" "${{ steps.module.outputs.name }}" <<'PY'
          import json
          import sys
          import urllib.parse

          tag, code, zip_name = sys.argv[1], sys.argv[2], sys.argv[3]
          base = "https://github.com/imRoxy2222/ColorOS17PerfectIcon"
          data = {
              "version": code,
              "versionCode": int(code),
              "zipUrl": f"{base}/releases/download/{tag}/{urllib.parse.quote(zip_name)}",
              "changelog": f"{base}/releases/tag/{tag}",
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ColorOS17PerfectIcon-${{ github.ref_name }}
          path: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.module.outputs.name }}
            update.json

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.module.outputs.name }}
            update.json

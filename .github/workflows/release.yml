name: Release

on:
  push:
    tags:
      # 版本 tag 为纯数字（1、2、3 …），由“校验版本号”步骤把关
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.C17_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.C17_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.C17_KEY_PASSWORD }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # versionCode 取的是 commit 数，必须拉完整历史
          fetch-depth: 0
          # 需要校验上一个 tag 是否存在
          fetch-tags: true

      - name: 校验版本号
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^[0-9]+$ ]] || [ "$TAG" -lt 1 ]; then
            echo "::error::tag 必须是纯数字版本号（1、2、3 …），当前为 $TAG"
            exit 1
          fi
          if [ "$TAG" -gt 1 ]; then
            PREV=$((TAG - 1))
            if ! git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then
              echo "::error::缺少上一个版本 tag：$PREV，请按顺序发版"
              exit 1
            fi
          fi

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('code/**/*.gradle*', 'code/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 还原签名密钥
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/c17-release.jks
        run: |
          echo "${{ secrets.C17_KEYSTORE_B64 }}" | base64 -d > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"

      - name: 构建 APK
        working-directory: code
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/c17-release.jks
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: 统计适配应用数量
        id: adapted
        run: |
          COUNT=$(python3 - <<'PY'
          import os

          root = "my_product/media/theme/uxicons/hdpi"
          skip = (".", "temp_", "plus.", "icons-")
          names = []
          for name in os.listdir(root):
              if not os.path.isdir(os.path.join(root, name)):
                  continue
              if name.startswith(skip) or name.endswith(".bak") or "." not in name:
                  continue
              # com.yipiao#com.app.main.entrance.MainActivity 这类写法只取包名
              names.append(name.split("#")[0])

          name_set = set(names)
          apps = set()
          for name in names:
              if "和" in name:
                  apps.update(name.split("和"))
                  continue
              # “包名.Activity” 目录归并到包名
              parts = name.split(".")
              if any(".".join(parts[:i]) in name_set for i in range(1, len(parts))):
                  continue
              apps.add(name)
          print(len(apps))
          PY
          )
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: 校验并重命名 APK
        id: apk
        run: |
          APK="code/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          cp "$APK" "完美图标.apk"
          echo "name=完美图标.apk" >> "$GITHUB_OUTPUT"

      - name: 打包 Magisk 模块
        id: module
        run: |
          CODE=$(git rev-list --count HEAD)
          OUT="完美图标模块_${CODE}_适配${{ steps.adapted.outputs.count }}.zip"
          python3 build.py -q -o "$OUT"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ColorOS17PerfectIcon-${{ github.ref_name }}
          path: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.module.outputs.name }}

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.module.outputs.name }}
